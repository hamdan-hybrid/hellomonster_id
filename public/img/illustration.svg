<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" role="img" aria-label="Ilustrasi kasir, produk, grafik penjualan, dan inventori">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41b4a7"/>
      <stop offset="1" stop-color="#2e9488"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4f8c"/>
      <stop offset="1" stop-color="#113b6d"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04142b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Lingkaran dekoratif -->
  <circle cx="455" cy="70" r="46" fill="#41b4a7" opacity="0.18"/>
  <circle cx="70" cy="380" r="30" stroke="#ef8611" stroke-width="3" opacity="0.45"/>

  <!-- Kartu grafik penjualan -->
  <g filter="url(#sh)">
    <rect x="200" y="28" width="300" height="196" rx="18" fill="url(#card)"/>
  </g>
  <text x="224" y="62" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#113b6d">Penjualan Minggu Ini</text>
  <text x="224" y="90" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#10213a">Rp 18,4 jt</text>
  <rect x="380" y="74" width="62" height="22" rx="11" fill="#ddf3f0"/>
  <text x="392" y="89" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="700" fill="#1f8a6a">▲ 12%</text>
  <g>
    <rect x="228" y="164" width="24" height="40" rx="6" fill="url(#bar)" opacity="0.55"/>
  <rect x="264" y="146" width="24" height="58" rx="6" fill="url(#bar)" opacity="0.65"/>
    <rect x="300" y="154" width="24" height="50" rx="6" fill="url(#bar)" opacity="0.75"/>
    <rect x="336" y="128" width="24" height="76" rx="6" fill="url(#bar)" opacity="0.85"/>
    <rect x="372" y="138" width="24" height="66" rx="6" fill="url(#bar)"/>
    <rect x="408" y="112" width="24" height="92" rx="6" fill="#ef8611"/>
    <rect x="444" y="124" width="24" height="80" rx="6" fill="url(#bar)"/>
  </g>
  <path d="M232 150 L276 132 L312 140 L348 114 L384 124 L420 96 L456 108" stroke="#113b6d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

  <!-- Terminal kasir -->
  <g filter="url(#sh)">
    <rect x="60" y="150" width="210" height="140" rx="14" fill="#0b2a50"/>
    <rect x="70" y="160" width="190" height="112" rx="8" fill="url(#screen)"/>
  </g>
  <rect x="84" y="174" width="96" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
  <rect x="84" y="192" width="62" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
  <rect x="84" y="214" width="76" height="40" rx="8" fill="#41b4a7"/>
  <rect x="168" y="214" width="76" height="40" rx="8" fill="#ffffff" opacity="0.14"/>
  <text x="96" y="239" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#ffffff">BAYAR</text>
  <text x="180" y="239" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#ffffff" opacity="0.8">Rp 45.000</text>
  <path d="M145 290 L185 290 L195 322 L135 322 Z" fill="#0b2a50"/>
  <rect x="110" y="320" width="110" height="12" rx="6" fill="#0b2a50"/>

  <!-- Struk -->
  <g filter="url(#sh)">
    <path d="M250 214 h66 v104 l-8.25 -7 l-8.25 7 l-8.25 -7 l-8.25 7 l-8.25 -7 l-8.25 7 l-8.25 -7 l-8.25 7 Z" fill="#ffffff"/>
  </g>
  <rect x="262" y="230" width="42" height="6" rx="3" fill="#113b6d"/>
  <rect x="262" y="246" width="30" height="5" rx="2.5" fill="#cfd8e3"/>
  <rect x="262" y="258" width="38" height="5" rx="2.5" fill="#cfd8e3"/>
  <rect x="262" y="270" width="26" height="5" rx="2.5" fill="#cfd8e3"/>
  <rect x="262" y="288" width="42" height="6" rx="3" fill="#ef8611"/>

  <!-- Inventori / kotak produk -->
  <g filter="url(#sh)">
    <rect x="352" y="262" width="78" height="64" rx="8" fill="#ef8611"/>
    <rect x="432" y="262" width="78" height="64" rx="8" fill="#d97405"/>
    <rect x="392" y="200" width="78" height="64" rx="8" fill="#f59a33"/>
  </g>
  <rect x="380" y="262" width="22" height="18" fill="#ffffff" opacity="0.35"/>
  <rect x="460" y="262" width="22" height="18" fill="#ffffff" opacity="0.3"/>
  <rect x="420" y="200" width="22" height="18" fill="#ffffff" opacity="0.4"/>
  <rect x="362" y="306" width="30" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="442" y="306" width="30" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

  <!-- Kartu stok -->
  <g filter="url(#sh)">
    <rect x="300" y="346" width="210" height="62" rx="14" fill="#ffffff"/>
  </g>
  <rect x="316" y="362" width="30" height="30" rx="8" fill="#ddf3f0"/>
  <path d="M323 377 l5 5 l10 -10" stroke="#2e9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="358" y="374" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#10213a">Stok diperbarui</text>
  <text x="358" y="392" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#7c8aa0">248 produk · 3 cabang</text>

  <!-- Koin -->
  <g filter="url(#sh)">
    <circle cx="168" cy="380" r="30" fill="#ef8611"/>
  </g>
  <circle cx="168" cy="380" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>
  <text x="168" y="386" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Rp</text>
  <circle cx="226" cy="396" r="18" fill="#41b4a7"/>
  <circle cx="226" cy="396" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
</svg>
