<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backoffice · DOMPET USAHA</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/img/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/img/icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/backoffice.webmanifest">
  <meta name="theme-color" content="#0e2f59">
  <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/base.css?v=23">
  <link rel="stylesheet" href="/css/app.css?v=23">
  <script type="module" src="/js/backoffice.js?v=24"></script>
  <!-- Modul halaman pertama (dashboard) ikut diunduh paralel sejak awal. Modul menu lain sengaja tidak
       di-preload: diunduh saat menunya dibuka (lihat ROUTES di backoffice.js). -->
  <link rel="modulepreload" href="/js/lib.js">
  <link rel="modulepreload" href="/js/i18n.js">
  <link rel="modulepreload" href="/js/locale-id.js">
  <link rel="modulepreload" href="/js/i18n-ui.js">
  <link rel="modulepreload" href="/js/bo-core.js">
  <link rel="modulepreload" href="/js/bo-profile.js">
  <link rel="modulepreload" href="/js/bo-dashboard.js">
  <link rel="modulepreload" href="/js/bo-charts.js">
</head>
<body>
  <div class="bo-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama" data-i18n-attr="aria-label:shell.navMain">
      <div class="sidebar-brand">
        <a class="brand" href="#dashboard"><img class="logo-light" src="/img/logo.png" alt="DOMPET USAHA" width="148" height="60"><img class="logo-dark" src="/img/logo-dark.png" alt="DOMPET USAHA" width="148" height="60"></a>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span data-i18n="shell.developedBy">Dikembangkan oleh</span>
        <strong>PT Hybrid Daya Cakra Global</strong>
      </div>
    </aside>
    <div class="sidebar-scrim" id="scrim" hidden></div>

    <div class="bo-main">
      <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Buka menu" data-i18n-attr="aria-label:shell.openMenu" aria-controls="sidebar" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title">
          <span class="crumb" data-i18n="shell.crumb">Backoffice</span>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="user-box">
          <button type="button" class="user-trigger" id="user-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu">
            <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
            <span class="user-meta">
              <strong id="user-name"></strong>
              <span id="user-role"></span>
            </span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="user-menu" id="user-menu" role="menu" aria-labelledby="user-trigger" hidden>
            <div class="user-menu-head">
              <span class="user-avatar user-avatar-lg" id="menu-avatar" aria-hidden="true"></span>
              <div>
                <strong id="menu-name"></strong>
                <span id="menu-email"></span>
                <span class="menu-role" id="menu-role"></span>
              </div>
            </div>
            <button type="button" role="menuitem" id="btn-profile">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span><span data-i18n="shell.profile">Profil saya</span><small data-i18n="shell.profileHint">Foto, nama, dan email</small></span>
            </button>
            <button type="button" role="menuitem" id="btn-password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span><span data-i18n="shell.password">Ganti password</span><small data-i18n="shell.passwordHint">Ubah password Backoffice</small></span>
            </button>
            <!-- Buku panduan pengguna (PDF berbahasa Indonesia, sumber di manual/); versi di URL agar cache browser ikut diperbarui. -->
            <a role="menuitem" id="btn-manual" href="/docs/panduan-dompet-usaha.pdf?v={{APP_VERSION}}" target="_blank" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
              <span><span data-i18n="shell.manual">Buku panduan</span><small data-i18n="shell.manualHint">Cara memakai aplikasi (PDF)</small></span>
            </a>
            <!-- Dokumentasi API pintu tiket (bo-gates.js openApiDocs); tampil bila boleh melihat Pintu Tiket. -->
            <button type="button" role="menuitem" id="btn-api-docs" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
              <span><span data-i18n="shell.apiDocs">Dokumentasi API</span><small data-i18n="shell.apiDocsHint">Pintu tiket &amp; barrier</small></span>
            </button>
            <!-- Pasang Backoffice sebagai aplikasi (PWA); tampil hanya bila browser mengizinkan (/js/pwa-install.js). -->
            <button type="button" role="menuitem" id="btn-install" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
              <span><span data-i18n="shell.installApp">Pasang aplikasi</span><small data-i18n="shell.installAppHint">Ikon di HP / komputer, tanpa bar browser</small></span>
            </button>
            <div class="menu-sep" role="separator"></div>
            <button type="button" role="menuitem" class="menu-danger" id="btn-logout">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              <span data-i18n="shell.logout">Keluar</span>
            </button>
          </div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-card" id="modal-form" novalidate></form>
  </dialog>
</body>
</html>
