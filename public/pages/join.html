<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="join.docTitle">Daftar Member</title>
  <!-- Daftar mandiri pelanggan: dibuka dari QR di layar kasir (tautan sekali pakai), bukan untuk mesin pencari. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#6ec6ff">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/img/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Tema perangkat untuk menu bahasa; taman & tiket memakai warnanya sendiri (join.css). -->
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/base.css?v=17">
  <link rel="stylesheet" href="/css/park.css?v=1">
  <link rel="stylesheet" href="/css/join.css?v=1">
  <script type="module" src="/js/join.js?v=1"></script>
  <link rel="modulepreload" href="/js/lib.js?v=17">
  <link rel="modulepreload" href="/js/i18n.js?v=17">
</head>
<body class="join">
  <!-- Taman bermain di belakang formulir (diisi park.js). -->
  <div class="park" aria-hidden="true"></div>

  <main class="stage">
    <div class="topbar" id="topbar"></div>
    <header class="gate">
      <div class="gate-sign" id="sign">
        <span class="gate-eyebrow" data-i18n="join.welcome">Selamat datang di</span>
        <h1 class="gate-name" id="biz">&nbsp;</h1>
      </div>
      <div class="gate-posts" aria-hidden="true"><i></i><i></i></div>
    </header>
    <section class="ticket" id="ticket" aria-live="polite">
      <div class="ticket-loading"><span class="ball" aria-hidden="true"></span><span data-i18n="join.loading">Menyiapkan formulir…</span></div>
    </section>
    <p class="powered"><a href="https://dompetusaha.com" target="_blank" rel="noopener" data-i18n="join.poweredBy">Didukung oleh DompetUsaha.com</a></p>
  </main>
</body>
</html>
