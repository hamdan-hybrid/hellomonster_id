<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="play.docTitle">Monitor Bermain · DOMPET USAHA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e2f59">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/img/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/base.css?v=21">
  <link rel="stylesheet" href="/css/monitor.css?v=1">
  <script type="module" src="/js/monitor.js?v=1"></script>
  <link rel="modulepreload" href="/js/lib.js">
  <link rel="modulepreload" href="/js/i18n.js">
</head>
<body class="play-monitor">
  <!-- Monitor Bermain (monitor.js): anak yang sedang bermain di cabang kasir ini, sisa waktu, dan tombol panggil. -->
  <header class="pm-top">
    <span class="pm-logo"><img src="/img/logo.png" alt="DOMPET USAHA" width="79" height="32"></span>
    <div class="pm-title">
      <strong data-i18n="play.title">Monitor Bermain</strong>
      <span id="branch-name"></span>
    </div>
    <div class="pm-stats" id="stats" aria-live="polite"></div>
    <div class="pm-clock" aria-hidden="true"><strong id="clock-time">--:--</strong><span id="clock-date"></span></div>
    <a class="btn btn-sm pm-back" href="/pos" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span data-i18n="play.backToPos">Kembali ke kasir</span>
    </a>
  </header>

  <div class="pm-bar" id="bar"></div>
  <p class="pm-notice" id="notice" role="status" hidden></p>
  <main class="pm-main" id="view" aria-live="polite"></main>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-card" id="modal-form" novalidate></form>
  </dialog>
</body>
</html>
